# Server
server.port=8080

# H2 file-based database (persists between restarts, no external DB needed)
spring.datasource.url=jdbc:h2:file:./data/musicdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optional: browse the DB at /h2-console while developing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Where uploaded audio files are stored on disk
app.upload.dir=uploads
